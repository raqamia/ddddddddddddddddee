[versions]
agp = "9.1.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
navigationFragment = "2.7.7"
navigationUi = "2.7.7"
viewpager2 = "1.1.0"
lifecycleViewmodel = "2.8.0"
lifecycleLivedata = "2.8.0"
converterGson = "2.12.0"
glide = "4.16.0"
androidPdfViewer = "3.2.0"
securityCrypto = "1.1.0"
swiperefreshlayout = "1.1.0"
kotlin = "2.2.10"
googleDevtoolsKsp = "2.3.5"
roomRuntime = "2.7.0"
roomCompiler = "2.7.0"
retrofit = "2.12.0"
loggingInterceptor = "4.12.0"
okhttp = "4.12.0"
